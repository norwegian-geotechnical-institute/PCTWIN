# Logic tree for the PS scenario rates (Sunda and Makran).
# Every modelling choice of the rate calculation is set here or in zones.yaml.
# Decision numbers refer to the decision log in docs/guide.md.

levels:                       # epistemic levels; weights within a level sum to 1
  rate_source:                # decision 1; version 1.1 weights (decision 26)
    seismic: 0.4
    geodynamic: 0.6
  segmentation:               # decision 26
    unconstrained: 0.4
    segmented: 0.6
  mfd_form:
    truncated_gr: 0.5
    tapered_pareto: 0.5
  b_value:                    # decision 24: grid centred on the catalogue b (0.86), symmetric weights 1:2:3:2:1,
    values: [0.56, 0.71, 0.86, 1.01, 1.16]     # so the weighted mean is 0.86
    weights: [1, 2, 3, 2, 1]                   # normalised to sum to 1. Version 1.0: n 10, min 0.7, max 1.2, weights linear
  mmax:                       # weights from Davies et al. (2018); the observed alternative is set in options: mmax_observed
    observed: 0.10
    area_limit: 0.45
    mean: 0.45
  coupling:                   # decision 25; geodynamic branches only. Broad range, not matched to the catalogue
    rule: factor              # factor: preferred x factor;  offset (version 1.0): preferred -/+ offset
    factors:
      low: 0.5
      preferred: 1.0
      high: 2.0
    offset: 0.2               # used by rule offset only
    floor: 0.1
    ceiling: 1.3              # above 1 on purpose; floor and ceiling as in Davies and Griffin (2020), factors are our choice
    weights:
      low: 0.25
      preferred: 0.5
      high: 0.25

event_tree:                   # pooled inside each magnitude bin, not logic tree levels (decision 4)
  rigidity_model:             # decision 27: 00 homogeneous and 01 theoretical, pooled (version 1.0: 00 only)
    "00": 0.4
    "01": 0.6
    "02": 0.0
    "03": 0.0
  scaling_law:                # 01 Strasser et al. (2010), 02 Thingbaijam et al. (2017)
    "01": 0.5
    "02": 0.5
  scaling_sample_00_counts_as_sample: true   # decision 10
  as_level: []                # decision 28: event-tree items to treat as logic-tree levels instead of pooling them,
                              # any of: scaling_law, scaling_sample. [] = pooled, as in version 1.0
  n_scaling_samples: 10       # samples 00 to 09; used only with scaling_sample in as_level (equal weights)

options:
  rigidity:                           # decision 27; see ptha_rates/rigidity.py
    models: {"00": homogeneous, "01": theoretical}
    fact_mu: 0.5
    needs_footprints: ["01"]          # models whose shares need footprints with slip from the slip files (footprints: from_file)
    without_footprints: skip          # skip: such a model is left out and the other weights renormalised;
                                      # approximate: kept, placed with the segment fractions of its scenarios
  bayesian_update: false              # decision 13
  crossing_penalty: 1.0               # 1 = no penalty on boundary-crossing ruptures
  budget_area: provider_utm           # decision 29: triangle areas in the budget. provider_utm: as the scenario provider computes
                                      # them (UTM zone of zones.yaml), consistent with the named moments; mesh: true areas (v1.0)
  bin_edges: provider                 # decision 22: config/magnitude_intervals.csv (version 1.0: midpoints, decision 5)
  mmax_observed: {n_sigma: 2, sigma: 0.1}   # decision 23: observed Mmax = largest event + n_sigma x sigma, at most the
                                      # area limit (version 1.0: n_sigma 0)
  convergence_projection: none        # decision 6; none = convergence used as given
  tapered_corner: mmax                # decision 7; corner magnitude = Mmax alternative, no hard limit
  tapered_tail: truncate_at_last_bin  # rate above the last bin has no scenario. truncate_at_last_bin: the budget is
                                      # balanced over the modelled bins; not_modelled: the moment above the last bin is lost
  xi_min_magnitude: first_bin_lower_edge   # decision 8
  footprints: segment_fraction_approximation   # decision 9. How the rate of a bin is placed among rupture positions:
                                      #   segment_fraction_approximation  from the fraction of each rupture in each segment (version 1.0)
                                      #   estimated   from footprints grown around the initiation triangle to the area of the scaling law
                                      #   from_file   from footprints reduced from the slip files (tools/reduce_slip_files.py; data/README.md)
  footprint_area:                     # median rupture area of each scaling law, log10(A km2) = a + b Mw; used by `estimated` only
    "01": [-3.476, 0.952]             # Strasser et al. (2010), interface
    "02": [-3.292, 0.949]             # Thingbaijam et al. (2017), subduction interface
